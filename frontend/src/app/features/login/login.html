<div class="login-wrap">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="login-title">Caja de Ahorros</h1>
    <p class="login-subtitle">Ingrese sus credenciales</p>

    <label class="field">
      <span>Usuario</span>
      <input formControlName="username" type="text" autocomplete="username" data-testid="username" />
    </label>

    <label class="field">
      <span>Contraseña</span>
      <input formControlName="password" type="password" autocomplete="current-password" data-testid="password" />
    </label>

    @if (error()) {
      <div class="alert alert-error" data-testid="login-error">{{ error() }}</div>
    }

    <button type="submit" class="btn btn-primary btn-block" data-testid="login-submit" [disabled]="loading()">
      {{ loading() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
</div>
