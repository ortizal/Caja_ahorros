<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <div class="login-brand-icon">🏦</div>
      <h1 class="login-title">Caja de Ahorros</h1>
      <p class="login-subtitle">Sistema de Gestión Financiera Enterprise</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <label class="field">
        <span>Usuario</span>
        <input
          class="form-control form-control-sm"
          formControlName="username"
          type="text"
          placeholder="Ej. admin"
          autocomplete="username"
          data-testid="username"
        />
      </label>

      <label class="field">
        <span>Contraseña</span>
        <div class="password-wrap">
          <input
            class="form-control form-control-sm"
            formControlName="password"
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="••••••••"
            autocomplete="current-password"
            data-testid="password"
          />
          <button type="button" class="password-toggle" (click)="showPassword.set(!showPassword())"
                  [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                  data-testid="toggle-password">
            @if (showPassword()) {
              👁️‍🗨️
            } @else {
              👁️
            }
          </button>
        </div>
      </label>

      @if (error()) {
        <div class="alert alert-error" data-testid="login-error">
          <span class="alert-icon">⚠️</span>
          <span>{{ error() }}</span>
        </div>
      }

      <button
        type="submit"
        class="btn btn-primary btn-block btn-login-submit"
        data-testid="login-submit"
        [disabled]="loading()"
      >
        @if (loading()) {
          <span class="spinner-sm"></span>
          <span>Ingresando…</span>
        } @else {
          <span>Iniciar Sesión</span>
        }
      </button>
    </form>
  </div>
</div>
