<h1 class="page-title" data-testid="form-title">{{ esEdicion() ? 'Editar socio' : 'Nuevo socio' }}</h1>

@if (error()) {
  <div class="alert alert-error" data-testid="form-error">{{ error() }}</div>
}

@if (loading()) {
  <p>Cargando…</p>
} @else {
  <form class="form" [formGroup]="form" (ngSubmit)="submit()" data-testid="socio-form">
    <div class="grid">
      <label class="field">
        <span>Identificación *</span>
        <input formControlName="identificacion" data-testid="input-identificacion" />
      </label>
      <label class="field">
        <span>Nombres *</span>
        <input formControlName="nombres" data-testid="input-nombres" />
      </label>
      <label class="field">
        <span>Apellidos *</span>
        <input formControlName="apellidos" data-testid="input-apellidos" />
      </label>
      <label class="field">
        <span>Teléfono</span>
        <input formControlName="telefono" data-testid="input-telefono" />
      </label>
      <label class="field">
        <span>Email</span>
        <input formControlName="email" data-testid="input-email" />
      </label>
      <label class="field">
        <span>Dirección</span>
        <input formControlName="direccion" data-testid="input-direccion" />
      </label>
      <label class="field">
        <span>Fecha de ingreso *</span>
        <input type="date" formControlName="fechaIngreso" data-testid="input-fecha-ingreso" />
      </label>
      <label class="field">
        <span>Estado</span>
        <select formControlName="estado" data-testid="input-estado">
          <option value="ACTIVO">ACTIVO</option>
          <option value="SUSPENDIDO">SUSPENDIDO</option>
          <option value="RETIRADO">RETIRADO</option>
          <option value="FALLECIDO">FALLECIDO</option>
        </select>
      </label>
    </div>

    <section class="beneficiarios">
      <div class="page-header">
        <h2>Beneficiarios</h2>
        <button type="button" class="btn btn-outline btn-sm" (click)="agregarBeneficiario()">Agregar</button>
      </div>

      @for (grupo of beneficiarios.controls; track $index) {
        <div class="grid beneficiario" [formGroupName]="$index">
          <label class="field">
            <span>Nombres *</span>
            <input formControlName="nombres" data-testid="input-beneficiario-nombre" />
          </label>
          <label class="field">
            <span>Parentesco</span>
            <input formControlName="parentesco" data-testid="input-beneficiario-parentesco" />
          </label>
          <label class="field">
            <span>Porcentaje</span>
            <input type="number" formControlName="porcentaje" data-testid="input-beneficiario-porcentaje" />
          </label>
          <div class="field">
            <button type="button" class="btn btn-danger btn-sm" (click)="quitarBeneficiario($index)">Quitar</button>
          </div>
        </div>
      }
    </section>

    <div class="form-actions">
      <button type="button" class="btn btn-outline" (click)="cancelar()">Cancelar</button>
      <button type="submit" class="btn btn-primary" data-testid="btn-guardar-socio" [disabled]="form.invalid || guardando()">
        {{ guardando() ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </form>
}
