<div class="page-header">
  <div>
    <h1 class="page-title" data-testid="form-title">Registrar Asiento Contable</h1>
    <p class="page-subtitle">Registro manual de asientos en el libro diario</p>
  </div>
  <div class="header-actions">
    <button type="button" class="btn btn-sm btn-outline-secondary" (click)="cancelar()">Volver</button>
  </div>
</div>

@if (error()) {
  <div class="alert alert-error" data-testid="form-error">
    <span>⚠️ {{ error() }}</span>
  </div>
}

<form class="form" [formGroup]="form" (ngSubmit)="submit()" data-testid="asiento-form">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">Datos del Asiento</h3>
    </div>
    <div class="form-grid" style="margin-bottom: 16px;">
      <label class="field">
        <span>Fecha Asiento *</span>
        <input type="date" class="form-control form-control-sm" formControlName="fecha" data-testid="input-asiento-fecha" />
      </label>
      <label class="field" style="grid-column: span 2;">
        <span>Descripción / Glosa *</span>
        <input class="form-control form-control-sm" formControlName="descripcion" placeholder="Concepto del asiento" data-testid="input-asiento-descripcion" />
      </label>
    </div>

    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th style="width: 45%;">Cuenta Contable</th>
            <th>Debe ($)</th>
            <th>Haber ($)</th>
            <th style="width: 60px;"></th>
          </tr>
        </thead>
        <tbody formArrayName="detalles">
          @for (d of detalles.controls; track $index) {
            <tr [formGroupName]="$index">
              <td>
                <select class="form-select form-select-sm" formControlName="cuentaId" [attr.data-testid]="'input-asiento-cuenta-' + $index">
                  <option [ngValue]="0" disabled>Seleccione cuenta</option>
                  @for (c of planCuentas(); track c.id) {
                    <option [ngValue]="c.id" [disabled]="!c.aceptaMovimiento">{{ c.codigo }} — {{ c.nombre }}</option>
                  }
                </select>
              </td>
              <td><input type="number" step="0.01" class="form-control form-control-sm" formControlName="debe" placeholder="0.00" [attr.data-testid]="'input-asiento-debe-' + $index" /></td>
              <td><input type="number" step="0.01" class="form-control form-control-sm" formControlName="haber" placeholder="0.00" [attr.data-testid]="'input-asiento-haber-' + $index" /></td>
              <td>
                <button type="button" class="btn btn-sm btn-danger" (click)="quitarDetalle($index)" [disabled]="detalles.length === 1">
                  🗑
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <div class="form-actions" style="margin-top: 16px;">
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="agregarDetalle()" data-testid="btn-agregar-detalle">+ Agregar Línea</button>
      <button type="submit" class="btn btn-sm btn-primary" data-testid="btn-registrar-asiento" [disabled]="form.invalid || guardando()">
        {{ guardando() ? 'Guardando…' : '💾 Registrar Asiento' }}
      </button>
    </div>
  </div>
</form>
