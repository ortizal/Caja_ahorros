<div class="page-header">
  <div>
    <h1 class="page-title" data-testid="form-title">{{ esEdicion() ? 'Editar Usuario' : 'Nuevo Usuario' }}</h1>
    <p class="page-subtitle">Gestión de cuentas de acceso y asignación de roles</p>
  </div>
  <div class="header-actions">
    <button type="button" class="btn btn-sm btn-outline-secondary" (click)="cancelar()">Volver</button>
  </div>
</div>

@if (error()) {
  <div class="alert alert-error" data-testid="form-error">
    <span>⚠️ {{ error() }}</span>
  </div>
}

@if (loading()) {
  <div class="empty-state">
    <div class="empty-state-icon">⌛</div>
    <div class="empty-state-text">Cargando formulario…</div>
  </div>
} @else {
  <form class="form" [formGroup]="form" (ngSubmit)="submit()" data-testid="usuario-form">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Datos de la Cuenta</h3>
      </div>
      <div class="form-grid">
        <label class="field">
          <span>Nombre de Usuario *</span>
          <input class="form-control form-control-sm" formControlName="username" placeholder="ej. jperez" data-testid="input-username" />
        </label>

        <label class="field">
          <span>{{ esEdicion() ? 'Nueva Contraseña (opcional)' : 'Contraseña *' }}</span>
          <input type="password" class="form-control form-control-sm" formControlName="password" placeholder="••••••••" data-testid="input-password" />
        </label>

        <label class="field">
          <span>Nombre Completo *</span>
          <input class="form-control form-control-sm" formControlName="nombreCompleto" placeholder="Ej. Juan Pérez" data-testid="input-nombre-completo" />
        </label>

        <label class="field">
          <span>Correo Electrónico *</span>
          <input class="form-control form-control-sm" formControlName="email" placeholder="usuario@caja.org" data-testid="input-email" />
        </label>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Roles Asignados</h3>
      </div>
      <div class="form-inline" style="gap: 16px;" data-testid="roles-checks">
        @for (rol of roles(); track rol.id) {
          <label class="checkbox-label">
            <input
              class="form-check-input"
              type="checkbox"
              [checked]="rolSeleccionados().includes(rol.id)"
              (change)="toggleRol(rol.id)"
              [attr.data-testid]="'check-rol-' + rol.nombre"
            />
            <span>{{ rol.nombre }}</span>
          </label>
        }
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="cancelar()">Cancelar</button>
      <button type="submit" class="btn btn-sm btn-primary" data-testid="btn-guardar-usuario" [disabled]="form.invalid || guardando()">
        {{ guardando() ? 'Guardando…' : (esEdicion() ? 'Actualizar Usuario' : 'Crear Usuario') }}
      </button>
    </div>
  </form>
}
