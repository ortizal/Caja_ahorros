<div class="page-header">
  <div>
    <h1 class="page-title" data-testid="form-title">Apertura de Caja</h1>
    <p class="page-subtitle">Apertura de caja diaria para el registro de cobros, pagos y arqueos</p>
  </div>
  <div class="header-actions">
    <button type="button" class="btn btn-sm btn-outline-secondary" (click)="cancelar()">Volver</button>
  </div>
</div>

@if (error()) {
  <div class="alert alert-error" data-testid="form-error">
    <span>⚠️ {{ error() }}</span>
  </div>
}

<form class="form" [formGroup]="form" (ngSubmit)="submit()" data-testid="apertura-form">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">Datos de Apertura</h3>
    </div>
    <div class="form-grid">
      <label class="field">
        <span>Saldo Inicial *</span>
        <input type="number" step="0.01" class="form-control form-control-sm" formControlName="saldoInicial" placeholder="0.00" data-testid="input-saldo-inicial" />
      </label>
      @if (puedeAsignar()) {
        <label class="field">
          <span>Cajero *</span>
          <select class="form-select form-select-sm" formControlName="cajeroId" data-testid="select-cajero">
            <option [ngValue]="null">— Yo (cajero actual) —</option>
            @for (cajero of cajeros(); track cajero.id) {
              <option [ngValue]="cajero.id">{{ cajero.nombre }} ({{ cajero.username }})</option>
            }
          </select>
          @if (cargandoCajeros()) {
            <div class="empty-state-text">Cargando cajeros…</div>
          }
        </label>
      }
    </div>
  </div>

  <div class="form-actions">
    <button type="button" class="btn btn-sm btn-outline-secondary" (click)="cancelar()">Cancelar</button>
    <button type="submit" class="btn btn-sm btn-primary" data-testid="btn-confirmar-apertura" [disabled]="form.invalid || guardando()">
      {{ guardando() ? 'Abriendo…' : '🔓 Abrir Caja' }}
    </button>
  </div>
</form>
