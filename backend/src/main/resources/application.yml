spring:
  application:
    name: caja-ahorros-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/caja_ahorros}
    username: ${DB_USER:caja_app}
    password: ${DB_PASSWORD:caja_dev_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50
        page-parameter: page
        size-parameter: size
        sort-parameter: sort

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:caja-ahorros-alantek-secreto-jwt-2026-debe-tener-32-bytes-minimo}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    org.springframework.security: INFO
